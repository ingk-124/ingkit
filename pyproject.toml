[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ingkit"
version = "0.2.0"
description = "Python utility toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ingk-124" }]
dependencies = [
    "matplotlib",
    "netCDF4",
    "numpy",
    "pymatgen",
    "requests",
    "scipy",
    "selenium",
]

[project.optional-dependencies]
plotly = ["plotly"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
